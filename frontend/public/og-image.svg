<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 630"
     width="1200" height="630"
     role="img"
     aria-label="Louis — the developer platform for legal infrastructure">
  <!-- Cream paper background -->
  <rect width="1200" height="630" fill="#fbf8f2" />

  <!-- Subtle decorative gold orbs (very soft, painterly) -->
  <circle cx="120" cy="100" r="180" fill="#c9a961" opacity="0.06" />
  <circle cx="1080" cy="540" r="220" fill="#c9a961" opacity="0.05" />

  <!-- Inner border rule (paper edge) -->
  <rect x="40" y="40" width="1120" height="550"
        fill="none" stroke="#e7e2d6" stroke-width="1" />

  <!-- Small gold rule above the wordmark -->
  <line x1="555" y1="220" x2="645" y2="220"
        stroke="#c9a961" stroke-width="2" stroke-linecap="round" />

  <!-- Eyebrow above wordmark -->
  <text x="600" y="200"
        text-anchor="middle"
        font-family="'EB Garamond', Garamond, 'Times New Roman', Georgia, serif"
        font-size="20"
        letter-spacing="6"
        fill="#a37a2c"
        font-weight="400"
        style="text-transform: uppercase;">
    SOVEREIGN  ·  OPEN SOURCE  ·  FREE
  </text>

  <!-- Wordmark: Louis -->
  <text x="600" y="370"
        text-anchor="middle"
        font-family="'EB Garamond', Garamond, 'Times New Roman', Georgia, serif"
        font-size="160"
        font-weight="400"
        fill="#1f2937"
        letter-spacing="2">
    Louis
  </text>

  <!-- Tagline -->
  <text x="600" y="440"
        text-anchor="middle"
        font-family="'EB Garamond', Garamond, 'Times New Roman', Georgia, serif"
        font-size="32"
        font-style="italic"
        fill="#6b7280"
        font-weight="400">
    The developer platform for legal infrastructure.
  </text>

  <!-- Feature row -->
  <text x="600" y="500"
        text-anchor="middle"
        font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-size="16"
        fill="#9ca3af"
        letter-spacing="2">
    982 skills  ·  30+ jurisdictions  ·  BYO API keys  ·  MIT licensed
  </text>

  <!-- Bottom right credit -->
  <text x="1140" y="570"
        text-anchor="end"
        font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-size="14"
        fill="#9ca3af"
        font-weight="400">
    github.com/sboghossian/louis-legal  ·  MIT licensed
  </text>

  <!-- Bottom left Louis mark (small circle "L") -->
  <g transform="translate(60, 540)">
    <circle cx="20" cy="20" r="20" fill="#fbf8f2" stroke="#1f2937" stroke-width="1.2" />
    <circle cx="20" cy="20" r="18" fill="none" stroke="#c9a961" stroke-width="0.5" opacity="0.7" />
    <g fill="#1f2937" transform="translate(20,20) scale(0.55) translate(-32,-32)">
      <path d="M 24 18 L 24 44 L 25.6 44 L 25.6 18 Z" />
      <path d="M 21.4 18 L 21.4 19.2 L 28.2 19.2 L 28.2 18 Z" />
      <path d="M 21.4 42.8 L 21.4 44 L 25.6 44 L 25.6 42.8 Z" />
      <path d="M 24 42.8 L 42.4 42.8 L 42.4 44 L 24 44 Z" />
      <path d="M 42.4 41.6 L 42.4 45.2 L 43.4 45.2 L 43.4 41.6 Z" />
      <circle cx="42.4" cy="20" r="1.2" />
    </g>
  </g>
</svg>
