{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ include "louis.secretName" . }}
    labels:
        {{- include "louis.labels" . | nindent 8 }}
type: Opaque
stringData:
    # Database
    DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
    SUPABASE_DB_URL: {{ .Values.externalDatabase.url | quote }}
    # Object storage (S3-compatible)
    R2_ENDPOINT_URL: {{ .Values.externalStorage.endpoint | quote }}
    R2_BUCKET_NAME: {{ .Values.externalStorage.bucket | quote }}
    R2_ACCESS_KEY_ID: {{ .Values.externalStorage.accessKeyId | quote }}
    R2_SECRET_ACCESS_KEY: {{ .Values.externalStorage.secretAccessKey | quote }}
    # Supabase
    SUPABASE_URL: {{ .Values.supabase.url | quote }}
    SUPABASE_SECRET_KEY: {{ .Values.supabase.serviceRoleKey | quote }}
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: {{ .Values.supabase.anonKey | quote }}
    # LLM providers (BYO — empty strings are fine when unused)
    ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | quote }}
    GEMINI_API_KEY: {{ .Values.llm.geminiApiKey | quote }}
    OPENAI_API_KEY: {{ .Values.llm.openaiApiKey | quote }}
    # App signing secrets
    DOWNLOAD_SIGNING_SECRET: {{ required "secrets.downloadSigningSecret is required (openssl rand -hex 32)" .Values.secrets.downloadSigningSecret | quote }}
    USER_API_KEYS_ENCRYPTION_SECRET: {{ required "secrets.userApiKeysEncryptionSecret is required (openssl rand -hex 32)" .Values.secrets.userApiKeysEncryptionSecret | quote }}
    RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
{{- end }}
