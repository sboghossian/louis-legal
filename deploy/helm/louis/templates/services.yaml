apiVersion: v1
kind: Service
metadata:
    name: {{ include "louis.fullname" . }}-backend
    labels:
        {{- include "louis.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
spec:
    type: {{ .Values.backend.service.type }}
    ports:
        - name: http
          port: {{ .Values.backend.service.port }}
          targetPort: http
          protocol: TCP
    selector:
        {{- include "louis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "louis.fullname" . }}-frontend
    labels:
        {{- include "louis.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
spec:
    type: {{ .Values.frontend.service.type }}
    ports:
        - name: http
          port: {{ .Values.frontend.service.port }}
          targetPort: http
          protocol: TCP
    selector:
        {{- include "louis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
