apiVersion: v2
name: louis
description: |
    Louis — open-source legal AI workbench. This chart deploys the
    frontend (Next.js) and backend (Express) only. Postgres and S3-compatible
    object storage are EXTERNAL dependencies — provide them via values.yaml.
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# App version — track the Louis release this chart was tested against.
appVersion: "0.1.0"
home: https://github.com/sboghossian/louis
sources:
    - https://github.com/sboghossian/louis
keywords:
    - legal
    - ai
    - nextjs
    - express
    - self-hosted
maintainers:
    - name: Louis maintainers
