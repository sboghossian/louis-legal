# Cloudflare Tunnel — Louis (louis-legal repo).
#
# Routes legal.dashable.dev to the local Next.js frontend and
# legal-api.dashable.dev to the local Express backend.
#
# Quick start (run once):
#   brew install cloudflared
#   cloudflared tunnel login
#   cloudflared tunnel create louis-legal
#   cloudflared tunnel route dns louis-legal legal.dashable.dev
#   cloudflared tunnel route dns louis-legal legal-api.dashable.dev
#
# Then fill in the `tunnel:` UUID and `credentials-file:` path below
# (cloudflared prints both on `create`), and run:
#   ./deploy/cloudflared/run.sh
# or:
#   npm run tunnel

tunnel: c38f70b1-8334-46af-90fa-12514ba09f0d
credentials-file: /Users/stephanemacmini/.cloudflared/c38f70b1-8334-46af-90fa-12514ba09f0d.json

# Logs at $TMPDIR/cloudflared.log when run.sh is used.
loglevel: info
transport-loglevel: warn

# Increase the read timeout because /chat streams SSE.
originRequest:
  noTLSVerify: false
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  # SSE streams from /chat can run for ~60s+; give them headroom.
  httpHostHeader: ""
  disableChunkedEncoding: false

ingress:
  - hostname: legal.dashable.dev
    service: http://localhost:3000
  - hostname: legal-api.dashable.dev
    service: http://localhost:3001
  # Required catch-all.
  - service: http_status:404
